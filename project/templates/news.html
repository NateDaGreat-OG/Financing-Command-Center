{% extends "base.html" %}

{% block tabs %}
<div class="top-tabs">
    <a href="/news">Market News</a>
    <a href="/news/tickers">Ticker News</a>
    <a href="/news/ai">AI Filtered</a>
    <a href="/news/sentiment">Sentiment</a>
</div>
{% endblock %}

{% block content %}
<h1>Market News</h1>

{% if error %}
<p style="color:red;">Error: {{ error }}</p>
{% endif %}

{% for item in intel %}
<div class="news-card">
    <h3>{{ item.title }}</h3>
    <p>{{ item.summary }}</p>
    <a href="{{ item.url }}" target="_blank">Read More</a>
</div>
{% endfor %}
{% endblock %}
